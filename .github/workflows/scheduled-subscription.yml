name: Scheduled Subscription Publish

# The nightly publish, run by GitHub Actions.
#
# Each night this workflow checks out the pipeline at the pin below, builds its
# CLI, syncs the account pool from its database, measures through the nodes in
# the currently published subscription, and uploads the measured artifact to
# Cloudflare Pages. This repository owns only the schedule, the credentials and
# the run history; the pipeline code lives in `swimmingliu/auto-vpn`, pinned so
# a night cannot be changed by an in-flight branch.
#
# The crawl runs on the runner, not in a Cloudflare Container: Containers need
# the Workers Paid plan, while everything else works on the free plan. Egress is
# unchanged: the crawl goes out through the nodes in the already-published
# subscription, never through the runner's own address.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Measure only; do not publish'
        type: boolean
        default: false
  schedule:
    # 20:15 UTC — the slot the source server publishes on, so the two never
    # race for the same night.
    - cron: '15 20 * * *'
    # Slack for a cron the scheduler delivers late or not at all: the gate
    # turns these into no-ops once the campaign has published, and the retry
    # chain carries the ladder either way.
    - cron: '45 21 * * *'
    - cron: '30 23 * * *'
  # The chain's own event: the last step of an attempt dispatches the next
  # slot, so the ladder does not depend on GitHub's cron delivering anything
  # after the first run of the night.
  repository_dispatch:
    types: [subscription-publish-retry]

# `POST /repos/{owner}/{repo}/dispatches` is a *Contents: write* endpoint, not
# an Actions one: with `actions: write` the chain step answers 403 and the
# ladder silently stops at the first attempt. The gate's own reads (workflow
# runs, run jobs) need Actions read. Naming any permission sets the rest to
# none, so both must be listed.
permissions:
  contents: write
  actions: read

# A publish replaces the whole Pages production deployment, so two runs must
# never overlap.
#
# `cancel-in-progress: false` protects a *running* crawl; it cannot protect a
# merely *queued* one. GitHub keeps a single pending run per group and a newer
# arrival replaces it, so a manual dispatch parked behind a long crawl can be
# displaced by the next cron. The slot that does start re-reads the history and
# decides for itself, so a displaced run costs a wait, not the night.
concurrency:
  group: subscription-publish
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  MIHOMO_VERSION: "v1.19.34"
  # The auto-vpn commit whose CLI is measured. Move this deliberately; the
  # workflow and the CLI must come from the same commit.
  PIPELINE_REF: "a26d6ac1ddd54c04426594940689a1cd265adb72"

jobs:
  publish:
    name: Measure and publish
    runs-on: ubuntu-24.04
    # 360 is the ceiling a GitHub-hosted runner enforces; asking for more is
    # silently clamped to it. The budget inside is: at most 200 minutes of
    # pause (the gate caps it) + 150 for the crawl, which leaves 10 minutes of
    # setup and upload. A pause longer than that is not crawled after: the run
    # becomes a waiter, sleeps up to 345 minutes, hands the slot on and exits.
    # `test/retry-gate.test.mjs` pins all three budgets, so raising one cannot
    # quietly start killing runs mid-crawl.
    timeout-minutes: 360
    # No `environment:`: this repository owns these credentials outright, so
    # they live as repository secrets and variables. An environment here would
    # hide any secret added at repository level behind a scope this job never
    # enters, which reads as an empty secret at deploy time.
    defaults:
      run:
        working-directory: source
    steps:
      # This repository is checked out first: its gate decides whether the
      # pipeline even needs to be fetched.
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Which slot this is, read from the campaign's own run history. A manual
      # dispatch always runs; a campaign that already published ends here; a
      # slot inside the backoff window exits in seconds instead of starting a
      # seventy-five-minute crawl. `RETRY_PAYLOAD` is the parent's dispatch
      # body, empty for cron and manual runs.
      - name: Decide whether this slot runs
        id: slot
        # The job default is `source`, which the pipeline checkout below has not
        # created yet; bash would fail to start before the gate could decide.
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETRY_PAYLOAD: ${{ toJSON(github.event.client_payload || fromJSON('{}')) }}
        run: |
          # The script prints `run: <reason>`, `wait: <reason>` or `skip:
          # <reason>` itself. A step cannot read its own `outputs` —
          # `${{ steps.slot.outputs.reason }}` here would always interpolate
          # empty and show up in the log as a bare `slot: `.
          #
          # Exit 2 means the gate could not read the run history: it writes a
          # skip to the output file, but the step still needs to fail so the
          # run does not read as a green night that published nothing.
          status=0
          node runner/scripts/publish-retry-gate.mjs \
            --workflow scheduled-subscription.yml \
            --payload "$RETRY_PAYLOAD" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the retry gate could not read the run history; this slot will not crawl and the ladder stops here"
            exit "$status"
          fi

      # A chained slot is due at an exact time. Sleeping at the head of the run
      # keeps the ladder's pauses honest even when the crawl that dispatched it
      # finished late. A waiter sleeps here too, then hands the slot on.
      - name: Wait for the backoff window
        if: ${{ (steps.slot.outputs.run == 'true' || steps.slot.outputs.waiter == 'true') && steps.slot.outputs.wait_minutes != '0' }}
        working-directory: .
        run: |
          echo "sleeping ${{ steps.slot.outputs.wait_minutes }} min before attempt ${{ steps.slot.outputs.attempt }}"
          sleep $(( ${{ steps.slot.outputs.wait_minutes }} * 60 ))

      - name: Checkout the pipeline
        if: ${{ steps.slot.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: swimmingliu/auto-vpn
          ref: ${{ env.PIPELINE_REF }}
          path: source

      - name: Check required configuration
        if: ${{ steps.slot.outputs.run == 'true' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUB_URL: ${{ secrets.AUTOVPN_SUBSCRIPTION_URL }}
          POOL_DB: ${{ secrets.AUTOVPN_ACCOUNTS_DB_URL }}
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "missing $1" >&2; missing=1; fi; }
          check "secret CLOUDFLARE_API_TOKEN" "$CF_TOKEN"
          check "variable CLOUDFLARE_ACCOUNT_ID" "$CF_ACCOUNT"
          check "secret AUTOVPN_SUBSCRIPTION_URL" "$SUB_URL"
          check "secret AUTOVPN_ACCOUNTS_DB_URL" "$POOL_DB"
          exit "$missing"

      # Built from the pinned checkout, not installed from npm: a night depends
      # on CLI behaviour that a published version may not carry yet, and the
      # workflow and the CLI must be the same commit.
      - name: Build the CLI from the pinned checkout
        if: ${{ steps.slot.outputs.run == 'true' }}
        run: |
          npm --prefix npm/autovpn-cli ci --no-audit --no-fund --ignore-scripts
          npm --prefix npm/autovpn-cli run build
          npm install -g --no-audit --no-fund --ignore-scripts ./npm/autovpn-cli
          autovpn --version

      - name: Install mihomo
        if: ${{ steps.slot.outputs.run == 'true' }}
        run: |
          cloudflare/scripts/fetch-mihomo.sh "$MIHOMO_VERSION"
          install -m 0755 cloudflare/container/vendor/mihomo-linux-amd64 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v

      # The pool of record is the shared Postgres table; the sqlite file in the
      # runtime root is this run's working copy. Without the URL the run would
      # quietly rotate a local pool that no other host can see, so the sync is
      # required and must leave at least one active account — a pool that
      # synced but cannot lease fails one step later, inside the crawl.
      - name: Sync the account pool from the shared database
        if: ${{ steps.slot.outputs.run == 'true' }}
        env:
          VPN_AUTOMATION_RUNTIME_ROOT: ${{ runner.temp }}/autovpn
          AUTOVPN_ACCOUNTS_DB_URL: ${{ secrets.AUTOVPN_ACCOUNTS_DB_URL }}
        run: |
          autovpn accounts sync --pull \
            --project-root "$RUNNER_TEMP/autovpn" --output jsonl \
            > "$RUNNER_TEMP/pool.jsonl" || status=$?
          node -e '
            const fs = require("node:fs");
            const line = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").pop();
            let result = {};
            try { result = JSON.parse(line); } catch {}
            const stats = result.stats ?? {};
            const pulled = result.pulled ?? {};
            console.log(`pool ${result.pool ?? "(unconfigured)"}: pulled new=${pulled.inserted ?? 0} updated=${pulled.updated ?? 0}; local ${stats.total ?? 0} total / ${stats.active ?? 0} active`);
            if (result.ok !== true) { console.error(result.error ?? "the shared pool sync failed"); process.exit(1); }
            if (!(stats.active > 0)) { console.error("the pool has no active accounts after the sync"); process.exit(1); }
          ' "$RUNNER_TEMP/pool.jsonl"
          exit "${status:-0}"

      # Build the crawl egress before the measurement: the crawl must leave
      # through a subscription node, not through the runner's own address. The
      # supervisor process is what keeps mihomo alive, so it runs in the
      # background for the rest of the job.
      - name: Build the crawl egress from the published subscription
        if: ${{ steps.slot.outputs.run == 'true' }}
        env:
          SUBSCRIPTION_URL: ${{ secrets.AUTOVPN_SUBSCRIPTION_URL }}
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
          EGRESS_DIR: ${{ runner.temp }}/egress
        run: |
          node cloudflare/scripts/egress-on-runner.mjs --serve > "$RUNNER_TEMP/egress.log" 2>&1 &
          EGRESS_PID=$!
          echo "EGRESS_PID=$EGRESS_PID" >> "$GITHUB_ENV"
          # Wait for the line the script prints once a node reaches the vendor
          # host, or for the process to die and say why. 120 s covers a slow
          # health-check sweep; a dead supervisor exits the wait immediately
          # instead of burning the full budget.
          for _ in $(seq 1 60); do
            grep -q "mihomo is listening" "$RUNNER_TEMP/egress.log" 2>/dev/null && break
            kill -0 "$EGRESS_PID" 2>/dev/null || break
            sleep 2
          done
          cat "$RUNNER_TEMP/egress.log"
          grep -q "mihomo is listening" "$RUNNER_TEMP/egress.log"

      - name: Measure
        id: measure
        if: ${{ steps.slot.outputs.run == 'true' }}
        env:
          VPN_AUTOMATION_RUNTIME_ROOT: ${{ runner.temp }}/autovpn
          VPN_AUTOMATION_PROFILE_PATH: ${{ github.workspace }}/source/cloudflare/container/profile.cloudflare.toml
          VPN_AUTOMATION_PROXY_MODE: proxy
          VPN_AUTOMATION_UPSTREAM_PROXY: http://127.0.0.1:7897
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
          # The run pushes its leases back when it finishes.
          AUTOVPN_ACCOUNTS_DB_URL: ${{ secrets.AUTOVPN_ACCOUNTS_DB_URL }}
          # The profile defers its key to this variable, and the obfuscate stage
          # runs inside this step (after render), not only at publish.
          VPN_AUTOMATION_SUBSCRIPTION_KEY: ${{ secrets.AUTOVPN_SUBSCRIPTION_KEY }}
        run: |
          set -o pipefail
          autovpn run --project-root "$RUNNER_TEMP/autovpn" \
            --skip-deploy --skip-verify --output jsonl \
            | tee "$RUNNER_TEMP/run.jsonl" \
            | grep --line-buffered -E '"(stage|summary|run_failed)"' || true
          node -e '
            const fs = require("node:fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n");
            let summary = null;
            for (const line of lines) { try { const e = JSON.parse(line); if (e.type === "summary") summary = e; } catch {} }
            if (!summary) { console.error("no summary event"); process.exit(1); }
            if (summary.run_status !== "success") { console.error(summary.error ?? "run failed"); process.exit(1); }
            const count = Number(summary.counts?.final_links ?? 0);
            const profile = fs.readFileSync(process.argv[2], "utf8");
            const floor = Number(/^\s*min_final_links\s*=\s*(\d+)/m.exec(profile)?.[1] ?? 0);
            // The gate the source server and the Durable Object apply: publish
            // only above the floor. `--skip-deploy` means the CLI never checks
            // it, so the workflow does, and a held night is a successful night —
            // a thin sweep must not replace a working subscription.
            console.log(`final_links=${count} floor=${floor}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT ?? "/dev/null", `held=${count <= floor}\nfinal_links=${count}\n`);
          ' "$RUNNER_TEMP/run.jsonl" cloudflare/container/profile.cloudflare.toml

      - name: Report a held night
        if: ${{ steps.slot.outputs.run == 'true' && steps.measure.outputs.held == 'true' }}
        run: |
          echo "::notice::final_links=${{ steps.measure.outputs.final_links }} did not clear the floor; nothing was published and the previous subscription stays in service"

      - name: Publish
        if: ${{ steps.slot.outputs.run == 'true' && inputs.dry_run != true && steps.measure.outputs.held != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # `retry-stage` reads the profile again for `min_final_links`,
          # `[deploy]` and `[worker_build]`.
          VPN_AUTOMATION_RUNTIME_ROOT: ${{ runner.temp }}/autovpn
          VPN_AUTOMATION_PROFILE_PATH: ${{ github.workspace }}/source/cloudflare/container/profile.cloudflare.toml
          # The profile defers its key to this variable rather than committing
          # it. `resolveSecretQuery` throws when the sentinel is set and this is
          # empty, so a missing secret fails the publish instead of serving a
          # subscription keyed by the sentinel.
          VPN_AUTOMATION_SUBSCRIPTION_KEY: ${{ secrets.AUTOVPN_SUBSCRIPTION_KEY }}
          # The share worker's ADMIN token, same reasoning: no hardcoded
          # fallback remains in the CLI.
          VPN_AUTOMATION_PAGES_SECRET_ADMIN: ${{ secrets.AUTOVPN_PAGES_ADMIN }}
        run: |
          ARTIFACT="$(ls -dt "$RUNNER_TEMP"/autovpn/artifacts/* | head -1)"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          # The deploy stage is the CLI's own: it obfuscates, bundles and
          # uploads the exact artifact this run measured.
          autovpn retry-stage --project-root "$RUNNER_TEMP/autovpn" \
            --artifact-dir "$ARTIFACT" --stage deploy --output jsonl \
            > "$RUNNER_TEMP/deploy.jsonl" 2>&1 || true
          node -e '
            const fs = require("node:fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n");
            let summary = null;
            for (const line of lines) { try { const e = JSON.parse(line); if (e.type === "summary") summary = e; } catch {} }
            if (!summary) { console.error("no summary in the deploy log"); process.exit(1); }
            const d = summary.deployment ?? {};
            console.log(`deploy rc=${d.returncode} project=${d.project_name} url=${d.pages_project_url}`);
            // The project and URL are read back from the deploy, not assumed.
            fs.appendFileSync(process.env.GITHUB_ENV, `DEPLOY_URL=${d.pages_project_url}\n`);
            if (summary.run_status !== "success" || Number(d.returncode ?? 1) !== 0) {
              console.error(summary.error ?? "the deploy stage failed");
              process.exit(1);
            }
          ' "$RUNNER_TEMP/deploy.jsonl"

      # A 200 is not success: a wrong key and a stale deployment answer 200 too.
      # Decode the body and require this run's own links to be in it.
      - name: Verify what is actually served
        id: verify
        if: ${{ steps.slot.outputs.run == 'true' && inputs.dry_run != true && steps.measure.outputs.held != 'true' }}
        env:
          # The profile holds the sentinel, not the key; the value the deploy
          # actually used comes from the same secret the publish step read.
          VPN_AUTOMATION_SUBSCRIPTION_KEY: ${{ secrets.AUTOVPN_SUBSCRIPTION_KEY }}
        run: |
          PROFILE_QUERY="$(sed -nE 's/^[[:space:]]*secret_query[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' \
            cloudflare/container/profile.cloudflare.toml | head -1)"
          if [ "$PROFILE_QUERY" = '{{SUBSCRIPTION_KEY}}' ] || [ -z "$PROFILE_QUERY" ]; then
            SECRET_QUERY="$VPN_AUTOMATION_SUBSCRIPTION_KEY"
          else
            SECRET_QUERY="$PROFILE_QUERY"
          fi
          if [ -z "$SECRET_QUERY" ] || [ "$SECRET_QUERY" = '{{SUBSCRIPTION_KEY}}' ]; then
            echo "no subscription key: set the AUTOVPN_SUBSCRIPTION_KEY secret" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_URL" ]; then echo "the deploy reported no pages_project_url" >&2; exit 1; fi
          node cloudflare/scripts/verify-published.mjs "${DEPLOY_URL}/?${SECRET_QUERY}" "$ARTIFACT"

      # A public repository's artifacts are downloadable without authentication,
      # and the log carries one event per probed link with the full payload.
      # Each link becomes a stable short fingerprint instead of being dropped.
      - name: Strip node links from the log
        if: ${{ always() && steps.slot.outputs.run == 'true' }}
        run: |
          node cloudflare/scripts/redact-run-log.mjs \
            "$RUNNER_TEMP/run.jsonl" "$RUNNER_TEMP/run.redacted.jsonl"
          if [ -f "$RUNNER_TEMP/deploy.jsonl" ]; then
            node cloudflare/scripts/redact-run-log.mjs \
              "$RUNNER_TEMP/deploy.jsonl" "$RUNNER_TEMP/deploy.redacted.jsonl"
          fi
          leaked=0
          for f in "$RUNNER_TEMP"/run.redacted.jsonl "$RUNNER_TEMP"/deploy.redacted.jsonl; do
            [ -f "$f" ] || continue
            if grep -qE '(vmess|vless|trojan|ss|hysteria2?)://[A-Za-z0-9_-]' "$f"; then
              echo "a node link survived redaction in $f" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            # The upload below runs on `always()`, so *every* candidate has to
            # go, not just the one that matched first: the sibling has not been
            # checked yet and would be published unexamined. A failure with
            # nothing to upload is the safe outcome.
            rm -f "$RUNNER_TEMP"/run.redacted.jsonl "$RUNNER_TEMP"/deploy.redacted.jsonl
            echo "::error::a node link survived redaction; the logs were deleted, not uploaded" >&2
            exit 1
          fi

      # The ladder's next slot. Dispatched at the end of an attempt so the pause
      # is measured from when the crawl finished, and only when this attempt did
      # not publish: the gate the child re-reads would turn a post-publish
      # dispatch into a no-op anyway, but not spending the dispatch keeps the
      # run list honest about how many chances the night actually took.
      - name: Chain the next slot
        # `!cancelled()`, not `always()`: a failed crawl is exactly what the
        # ladder exists for and must hand over to the next slot, but a run the
        # operator cancelled must not spawn its successor.
        #
        # Gated on `chain`, not `run`: a waiter does not crawl, but handing the
        # pause on is how an eight-hour rung fits inside a six-hour job.
        if: ${{ !cancelled() && steps.slot.outputs.chain == 'true' }}
        # The job default is `source`, which a waiter never checks out.
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.slot.outputs.attempt }}
          WAITER: ${{ steps.slot.outputs.waiter }}
          DUE_AT: ${{ steps.slot.outputs.due_at }}
          MEASURED: ${{ steps.measure.outcome }}
          PUBLISHED_HERE: ${{ steps.verify.outcome == 'success' }}
        run: |
          # A run that already published has nothing left to chain; the
          # successor would read the publish and exit, but not firing it keeps
          # the run list honest.
          if [ "$PUBLISHED_HERE" = "true" ]; then
            echo "this attempt published; the ladder ends here"
            exit 0
          fi
          if [ "$WAITER" = "true" ]; then
            # The pause outlasted one job. The successor finishes it with the
            # same attempt number and the same due time, so no chance is spent
            # and no crawl starts early.
            payload="$(node runner/scripts/publish-retry-gate.mjs --handoff --attempt "$ATTEMPT" --due-at "$DUE_AT")"
          elif [ "$MEASURED" != "success" ] && [ "$MEASURED" != "failure" ]; then
            # The slot died before it measured — a registry 5xx in the build, a
            # missing secret. It spent no chance and earned no pause, so it
            # hands on the *same* slot with no due time and the successor
            # recomputes both from the history. `--next` here would charge the
            # night an attempt it never took and start the next pause early.
            payload="$(node runner/scripts/publish-retry-gate.mjs --handoff --attempt "$ATTEMPT")"
          else
            payload="$(node runner/scripts/publish-retry-gate.mjs --next --attempt "$ATTEMPT")"
          fi
          echo "dispatching the next slot with $payload"
          # Six tries over three minutes: this step is the only thing that keeps
          # the ladder alive, and a short API outage would otherwise end the
          # night's retries silently.
          for attempt in 1 2 3 4 5 6; do
            if printf '{"event_type":"subscription-publish-retry","client_payload":%s}' "$payload" \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -; then
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed; retrying" >&2
            sleep $(( attempt * 10 ))
          done
          echo "::error::the next slot could not be dispatched; the ladder stops here"
          exit 1

      - name: Upload the run log
        if: ${{ always() && steps.slot.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: subscription-publish-run
          path: |
            ${{ runner.temp }}/run.redacted.jsonl
            ${{ runner.temp }}/deploy.redacted.jsonl
          if-no-files-found: warn
          retention-days: 14
