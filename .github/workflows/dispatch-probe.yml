name: Dispatch probe
# Throwaway: proves which permission `POST /repos/{owner}/{repo}/dispatches`
# actually checks for GITHUB_TOKEN. The event_type matches no workflow, so a
# successful call starts nothing. Deleted once it has answered.
on:
  workflow_dispatch:

jobs:
  with-contents-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          printf '{"event_type":"dispatch-probe","client_payload":{}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - || rc=$?
          echo "contents-write rc=$rc"

  with-actions-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          printf '{"event_type":"dispatch-probe","client_payload":{}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - || rc=$?
          echo "actions-write rc=$rc"
